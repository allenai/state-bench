[project]
name = "state-bench"
version = "0.1.0"
description = "Formatter-independent state-tracking benchmark generation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
hub = [
    "datasets>=4.0",
    "huggingface-hub>=1.0",
    "pyarrow>=20.0",
]
analysis = [
    "pyarrow>=20.0",
    "transformers>=4.57",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "ty>=0.0.12",
]

[project.scripts]
state-bench = "state_bench.cli:main"
state-bench-stats = "state_bench.stats:main"
state-bench-token-histogram = "state_bench.token_histogram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
