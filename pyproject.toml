[project]
name = "state-bench"
version = "0.1.0"
description = "Formatter-independent state-tracking benchmark generation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "tqdm>=4.67",
]

[project.optional-dependencies]
hub = [
    "datasets>=4.0",
    "huggingface-hub>=1.0",
    "pyarrow>=20.0",
]
analysis = [
    "gigatoken>=0.9.0",
    "pyarrow>=20.0",
    "transformers>=4.57",
]
tokenization = [
    "dolma>=1.0.8",
    "huggingface-hub>=0.23,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "ruff>=0.14",
    "ty>=0.0.12",
]

[project.scripts]
state-bench = "state_bench.cli:main"
state-bench-stats = "state_bench.stats:main"
state-bench-token-histogram = "state_bench.token_histogram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
conflicts = [
    [
        { extra = "analysis" },
        { extra = "tokenization" },
    ],
    [
        { extra = "hub" },
        { extra = "tokenization" },
    ],
]

[tool.uv.sources]
dolma = { git = "https://github.com/jopetty/dolma" }

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
