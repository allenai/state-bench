schema_version: 1

dataset:
  name: periodic-test
  seed: 23
  output_dir: ../../data/periodic-test

splits:
  test:
    # 352 source traces per state width: 704 periodic sources total. This keeps
    # 32 examples in each of the eleven depth buckets through 10,000 updates.
    samples_per_condition: 352

generation:
  query_mode: all
  require_strict_witness: true
  allow_self_reference: false
  distinct_initial_values: false
  periodic_constant_probability: 0.0
  # Alternating bank-to-bank permutations preserve multiple value lineages and
  # give every final variable a long eager-copy dependency path.
  periodic_sampling_method: layered
  conditions:
    - complexity: periodic
      splits: [test]
      formatters: [integer-code]
      # Two or four variables cannot simultaneously provide two live value
      # lanes and an anchor-free all-variable query without spare registers.
      num_variables: [8, 16]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        min: 16
        max: 10000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 32
      filler:
        proportions: [0.0]

formatters:
  - config: ../formats/integer-code.yaml

output:
  local_format: jsonl
  include_canonical_trace: true
  include_final_state: true
  shard_size: 1000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true
