schema_version: 1

dataset:
  name: periodic-test-pure
  seed: 23
  output_dir: ../../data/periodic-test-pure

splits:
  test:
    # 352 source traces per state width: 1,408 periodic sources total. This keeps
    # 32 examples in each of the eleven depth buckets through 64,000 updates.
    samples_per_condition: 352

generation:
  query_mode: all
  require_strict_witness: true
  distinct_initial_values: false
  aperiodic_constants: {min: 0, max: 0}
  conditions:
    - complexity: periodic
      splits: [test]
      formatters: [integer-code]
      num_variables: [2, 4, 8, 16]
      num_values: 100
      extra_assignments:
        distribution: log-spaced
        min: 64
        max: 64000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 32
      filler:
        proportions: [0.0]

formatters:
  - config: ../formats/integer-code.yaml

output:
  include_canonical_trace: true
  include_final_state: true
  shard_size: 1000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true
