schema_version: 1

# A train-only copy of long-context.yaml for realistic generation profiling.
# Keep its sample budget and generation settings in sync with the train split
# there so profiles exercise the same scheduling, derivation, rendering, IPC,
# and JSONL-writing paths as the production build.
dataset:
  name: state-tracking-long-context-train-profile
  seed: 13
  output_dir: ../../data/state-tracking-long-context-train-profile

splits:
  train:
    samples_per_condition: 15400000
    formatters: [integer-code]

generation:
  query_mode: all
  require_strict_witness: true
  allow_self_reference: false
  distinct_initial_values: false
  periodic_constant_probability: 0.1
  periodic_sampling_method: layered
  conditions:
    - complexity: periodic
      splits: [train]
      formatters: [integer-code]
      num_variables: [6, 8, 16]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        # Layered sampling needs at least one assignment per variable.
        min: 16
        max: 256
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 1
      filler:
        proportions: [0.0, 0.25]
        distraction_levels: [easy]

formatters:
  - config: ../formats/integer-code.yaml

output:
  local_format: jsonl
  include_canonical_trace: true
  include_final_state: true
  minimal_splits: [train]
  omit_canonical_splits: [train]
  track_unique_semantics: false
  hash_files: false
  shard_size: 50
  target_shard_bytes: 128000000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true

huggingface:
  include_canonical_config: true
  config_naming: "{formatter}--{complexity}"
  data_format: parquet
  staging_workers: 2
  repository:
    repo_id: null
    private: true
  card:
    license: null
    language: [en]
    tags: [state-tracking, formal-languages, long-context, profiling]
