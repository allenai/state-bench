schema_version: 1

dataset:
  name: periodic-test-mixed-20pct
  seed: 23
  output_dir: ../../data/periodic-test-mixed-20pct

splits:
  test:
    # Match the pure dataset exactly: 32 examples in each of eleven buckets.
    samples_per_condition: 352

generation:
  query_mode: all
  require_strict_witness: true
  allow_self_reference: false
  distinct_initial_values: false
  # About 20% of extra assignments are value resets. They are placed early and
  # favor real variables with many later TMP-based swaps.
  periodic_constant_probability: 0.2
  periodic_sampling_method: swap
  conditions:
    - complexity: periodic
      splits: [test]
      formatters: [integer-code]
      num_variables: [2, 4, 8, 16]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        min: 64
        max: 64000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 32
      filler:
        proportions: [0.0]

formatters:
  - config: ../formats/integer-code.yaml

output:
  local_format: jsonl
  include_canonical_trace: true
  include_final_state: true
  shard_size: 1000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true
