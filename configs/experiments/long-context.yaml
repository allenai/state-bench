schema_version: 1

dataset:
  name: state-tracking-long-context-v1
  seed: 13
  output_dir: ../../data/state-tracking-long-context-v1

splits:
  test:
    # This is a fixed budget for each complexity/variable-count pair. It is
    # distributed across the log-spaced buckets below rather than repeated at
    # every depth. Uniform log-bucket weights provide comparable coverage from
    # short traces through the roughly one-million-token tail. With 17 target
    # assignment buckets, 340 periodic source rows gives exactly 20 samples per
    # target. Every source row produces periodic, aperiodic, and r-trivial rows.
    samples_per_condition: 340
  train:
    # Training covers short-to-medium traces with simple padding. It stops at
    # 256 extra assignments, leaving the long-context tail test-only. Only
    # integer-code is rendered, and any source whose semantics occur in test
    # is resampled.
    samples_per_condition: 15400000
    formatters: [integer-code]
    disjoint_from: [test]

generation:
  query_mode: all
  require_strict_witness: true
  allow_self_reference: false
  distinct_initial_values: false
  # Periodic traces mostly extend deep copy provenance chains; occasional
  # constants retain multiple value lineages and reset selected chains.
  periodic_constant_probability: 0.1
  conditions:
    # Padding is scheduled on short sources, then shared by all three derived
    # complexity classes and every selected formatter.
    - complexity: periodic
      splits: [test]
      num_variables: [2, 4, 6]
      num_values: 10
      extra_assignments: {min: 1, max: 1}
      # The fixed condition budget is spread across the zero-padding baseline
      # and every nonzero proportion/distraction combination.
      filler:
        # Proportions are the share of final prompt lines occupied by padding.
        proportions: [0.0, 0.25, 0.5, 0.75, 0.9]
        distraction_levels: [easy, medium, hard]
    # Sequence-length sweeps stay unpadded so the largest traces remain
    # tractable; these rows are likewise emitted in all three classes.
    - complexity: periodic
      splits: [test]
      num_variables: [2, 4, 6]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        min: 1
        # RULER is the most token-dense formatter at about 15.2 tokens per
        # assignment; 64k assignments therefore stays just below 1m tokens.
        max: 64000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 20
    # Training uses a log-spaced short-to-medium sweep with the unpadded
    # baseline and only 25% simple dot/comment padding. Its ×2 spacing matches
    # the test sweep, while the 256-assignment cap preserves a test-only tail.
    - complexity: periodic
      splits: [train]
      formatters: [integer-code]
      num_variables: [2, 4, 6]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        min: 1
        max: 256
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 1
      filler:
        proportions: [0.0, 0.25]
        distraction_levels: [easy]
    # Add padded integer-code examples at every assignment depth without
    # changing any of the existing test rows above. A moderate 25% padding
    # share keeps even the longest hard-padding prompts tractable.
    - complexity: periodic
      splits: [test]
      formatters: [integer-code]
      num_variables: [2, 4, 6]
      num_values: 10
      extra_assignments:
        distribution: log-spaced
        min: 1
        max: 64000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 20
      filler:
        proportions: [0.25]
        distraction_levels: [easy, medium, hard]
        stratify_by_assignment_bucket: true

formatters:
  - config: ../formats/integer-code.yaml
  - config: ../formats/cube-painting.yaml
  - config: ../formats/spreadsheet-cells.yaml
  - config: ../formats/status-lights.yaml
  - config: ../formats/people-in-rooms.yaml
  - config: ../formats/ruler.yaml

output:
  local_format: jsonl
  include_canonical_trace: true
  include_final_state: true
  # The training corpus is consumed as prompt/completion pairs. Avoid storing
  # redundant semantic traces, choices, and a canonical copy for every row.
  # Test remains the full inspection/evaluation artifact.
  minimal_splits: [train]
  omit_canonical_splits: [train]
  # Keeping a Python set of every generated semantic ID is infeasible at the
  # multi-billion-token training scale. Test IDs are still retained to enforce
  # train/test disjointness.
  track_unique_semantics: false
  # Skip the post-build reread of the entire corpus. Hub staging hashes its
  # published artifact independently.
  hash_files: false
  # Long rows are sharded much more finely to keep Parquet conversion and
  # selective downloads manageable.
  shard_size: 50
  target_shard_bytes: 128000000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true

huggingface:
  include_canonical_config: true
  config_naming: "{formatter}--{complexity}"
  data_format: parquet
  staging_workers: 2
  # Tokenization happens once during Hub staging. Rendered configs are exposed
  # as independently loadable splits; bounds are half-open [min, max).
  token_strata:
    tokenizer: allenai/Olmo-3-1025-7B
    # Gigatoken makes exact per-row OLMo-3 lengths practical during staging.
    mode: exact
    field: prefix
    # Short prompts use larger batches, while the character budget keeps
    # near-million-token prompts from occupying the same batch.
    batch_size: 64
    max_batch_characters: 16000000
    ranges:
      - {name: tokens_0_100k, min_tokens: 0, max_tokens: 100000}
      - {name: tokens_100k_500k, min_tokens: 100000, max_tokens: 500000}
      - {name: tokens_500k_1m, min_tokens: 500000, max_tokens: 1000000}
      - {name: tokens_1m_plus, min_tokens: 1000000, max_tokens: null}
  repository:
    repo_id: jacksonp-ai2/state-bench-lc
    private: true
  card:
    license: null
    language: [en]
    tags: [state-tracking, formal-languages, long-context, llm-evaluation]
