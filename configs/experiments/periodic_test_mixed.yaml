schema_version: 1

dataset:
  name: periodic-test-mixed
  seed: 23
  output_dir: ../../data/periodic-test-mixed

splits:
  test:
    # Match the pure dataset exactly: 32 examples in each of eleven buckets.
    samples_per_condition: 352

generation:
  query_mode: all
  require_strict_witness: true
  distinct_initial_values: false
  # Each trace mixes in a log-uniformly sampled count of value resets. Coverage
  # is governed by the count alone (~1.0 at 1 reset down to the ~0.2 floor by
  # 64), so this sweeps sensitivity coverage uniformly in every length bucket.
  aperiodic_constants: {min: 1, max: 64}
  # Solvable rows need the zero-based integer-code-modular formatter; they are
  # emitted from these same sources by solvable_test.yaml.
  families: [r-trivial, aperiodic, periodic]
  conditions:
    - complexity: periodic
      splits: [test]
      formatters: [integer-code]
      num_variables: [2, 4, 8, 16]
      num_values: 100
      extra_assignments:
        distribution: log-spaced
        min: 64
        max: 64000
        growth_factor: 2.0
        sample_decay: 1.0
        jitter_fraction: 0.0
        min_samples_per_bucket: 32
      filler:
        proportions: [0.0]

formatters:
  - config: ../formats/integer-code.yaml

output:
  include_canonical_trace: true
  include_final_state: true
  shard_size: 1000
  multiple_choice:
    num_distractors: 4
    shuffle_choices: true
