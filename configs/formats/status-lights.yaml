schema_version: 1
name: status-lights

vocabulary:
  variables: [light A, light B, light C, light D, light E, light F, light G, light H, light I, light J, light K, light L, light M, light N, light O, light P]
  temporary_variable: buffer light
  values: [red, orange, yellow, green, blue, purple, pink, teal, brown, gray, maroon, navy, olive, salmon, indigo, violet, magenta, cyan, turquoise, lavender, beige, tan, khaki, coral, crimson, azure, mint, jade, emerald, ruby, amber, gold, silver, bronze, copper, charcoal, slate, ivory, pearl, cream, rose, blush, plum, mauve, lilac, periwinkle, cobalt, sapphire, cerulean, aqua, seafoam, pine, lime, chartreuse, mustard, ochre, sienna, rust, brick, mahogany, chestnut, walnut, sand, taupe, fawn, wheat, honey, apricot, peach, melon, tangerine, vermilion, scarlet, cherry, wine, burgundy, mulberry, orchid, fuchsia, garnet, topaz, citrine, opal, onyx, ebony, jet, smoke, ash, steel, pewter, gunmetal, denim, midnight, frost, snow, eggshell, linen, parchment, sepia, umber]

templates:
  task_description: >-
    Track the color displayed by each status light after following the instructions.
  assign_constant: "Set $target to $value."
  assign_reference: "Set $target to the color currently displayed by $source."
  answer_prompt: "Final light colors:"
  state_assertion: "$variable displays $value."
  filler_easy: "$filler_dots"
  filler_medium: "Unrelated maintenance note $filler_index."
  filler_hard: "Archived note, not an instruction: $variable previously displayed $value."

layout:
  prompt_blocks: [task_description, program, answer_prompt]
  block_separator: "\n\n"
  instruction_separator: " "
  completion_separator: " "
  trailing_newline: false
